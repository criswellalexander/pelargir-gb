<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="40" y="34" font-size="15" font-weight="bold" fill="#111827">pelargir flax flow emulator: one band flow (D = 6: N_res of the band + S_gw in its 5 bins)</text>
  <text x="40" y="56" font-size="12" fill="#374151">Nine such flows (0.11 to 0.99 mHz, 5 bins each) are trained independently; the emulator's log density is their sum.</text>

  <!-- data path -->
  <rect x="40" y="84" width="170" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="125" y="104" fill="#111827" text-anchor="middle">N_res (band total)</text>
  <text x="125" y="120" font-size="11.5" fill="#374151" text-anchor="middle">integer count</text>
  <rect x="40" y="142" width="170" height="50" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="125" y="162" fill="#111827" text-anchor="middle">u ~ U(0, 1)</text>
  <text x="125" y="179" font-size="11.5" fill="#374151" text-anchor="middle">GL nodes u_k in log_prob</text>
  <rect x="40" y="206" width="170" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="125" y="226" fill="#111827" text-anchor="middle">S_gw (5 bins)</text>
  <text x="125" y="242" font-size="11.5" fill="#374151" text-anchor="middle">foreground PSD [1/Hz]</text>

  <rect x="248" y="112" width="96" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="296" y="132" fill="#111827" text-anchor="middle">N + u</text>
  <text x="296" y="148" font-size="11.5" fill="#374151" text-anchor="middle">dequantize</text>
  <path d="M 210 106 L 230 106 L 230 128 L 246 128" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 210 167 L 230 167 L 230 140 L 246 140" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="382" y="150" width="150" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="457" y="170" fill="#111827" text-anchor="middle">x = (N+u, S1..S5)</text>
  <text x="457" y="186" font-size="11.5" fill="#374151" text-anchor="middle">6 features</text>
  <path d="M 344 134 L 362 134 L 362 164 L 380 164" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 210 228 L 362 228 L 362 180 L 380 180" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="560" y="150" width="90" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="605" y="176" fill="#111827" text-anchor="middle">log10</text>
  <path d="M 532 172 L 558 172" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="678" y="150" width="196" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="776" y="170" fill="#111827" text-anchor="middle">(x - median) / half-range</text>
  <text x="776" y="186" font-size="11.5" fill="#374151" text-anchor="middle">fitted on the training set</text>
  <path d="M 650 172 L 676 172" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="902" y="150" width="190" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="6"/>
  <text x="997" y="170" fill="#111827" text-anchor="middle">x B / max|z|   (B = 4)</text>
  <text x="997" y="186" font-size="11.5" fill="#374151" text-anchor="middle">training data fill [-B, B]</text>
  <path d="M 874 172 L 900 172" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="1100" y="138" font-size="11.5" fill="#374151" text-anchor="end">every step's log|Jacobian| is added to log_prob</text>

  <!-- flow row -->
  <path d="M 997 194 L 997 272 L 86 272 L 86 290" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="292" width="92" height="56" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="86" y="315" fill="#111827" text-anchor="middle">y</text>
  <text x="86" y="332" font-size="11.5" fill="#374151" text-anchor="middle">in [-B, B]^6</text>

  <rect x="168" y="292" width="172" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="254" y="315" fill="#111827" text-anchor="middle">Coupling 1</text>
  <text x="254" y="332" font-size="11.5" fill="#374151" text-anchor="middle">transforms dims 0, 2, 4</text>
  <rect x="368" y="292" width="172" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="454" y="315" fill="#111827" text-anchor="middle">Coupling 2</text>
  <text x="454" y="332" font-size="11.5" fill="#374151" text-anchor="middle">transforms dims 1, 3, 5</text>
  <rect x="568" y="292" width="172" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="654" y="315" fill="#111827" text-anchor="middle">Coupling 3</text>
  <text x="654" y="332" font-size="11.5" fill="#374151" text-anchor="middle">transforms dims 0, 2, 4</text>
  <rect x="768" y="292" width="172" height="56" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="854" y="315" fill="#111827" text-anchor="middle">Coupling 4</text>
  <text x="854" y="332" font-size="11.5" fill="#374151" text-anchor="middle">transforms dims 1, 3, 5</text>
  <rect x="976" y="292" width="184" height="56" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" rx="6"/>
  <text x="1068" y="315" fill="#111827" text-anchor="middle">z ~ N(0, I_6)</text>
  <text x="1068" y="332" font-size="11.5" fill="#374151" text-anchor="middle">standard-normal base</text>
  <path d="M 132 320 L 166 320" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 340 320 L 366 320" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 320 L 566 320" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 740 320 L 766 320" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 940 320 L 974 320" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="40" y="780" font-size="12" fill="#374151">log_prob runs y to z (the inverse spline chain); sampling runs z to y and then undoes the transforms (N_res = floor of the dequantized count).</text>

  <!-- context bus -->
  <path d="M 254 398 L 854 398" stroke="#374151" stroke-width="1.4" fill="none"/>
  <path d="M 254 398 L 254 350" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 454 398 L 454 350" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 654 398 L 654 350" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 854 398 L 854 350" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="40" y="414" width="368" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="224" y="434" fill="#111827" text-anchor="middle">context (8): m_mu, m_sigma, r_disk, r_bulge, q_BD,</text>
  <text x="224" y="451" fill="#111827" text-anchor="middle">a_alpha, rho_thresh, log10 lambda_tot</text>
  <rect x="436" y="414" width="270" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="571" y="434" fill="#111827" text-anchor="middle">c = (context - median) / half-range</text>
  <text x="571" y="451" font-size="11.5" fill="#374151" text-anchor="middle">fed to every conditioner</text>
  <path d="M 408 439 L 434 439" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 571 414 L 571 398" stroke="#374151" stroke-width="1.4" fill="none"/>

  <!-- inset: one coupling layer -->
  <rect x="40" y="490" width="780" height="262" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
  <text x="56" y="512" font-size="15" font-weight="bold" fill="#111827">Inside one coupling layer (mask m alternates between layers)</text>

  <rect x="58" y="530" width="140" height="48" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="128" y="550" fill="#111827" text-anchor="middle">y_masked = y * m</text>
  <text x="128" y="566" font-size="11.5" fill="#374151" text-anchor="middle">dims kept this layer</text>
  <rect x="220" y="530" width="170" height="48" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="305" y="550" fill="#111827" text-anchor="middle">[ y_masked || c ]</text>
  <text x="305" y="566" font-size="11.5" fill="#374151" text-anchor="middle">6 + 8 = 14 inputs</text>
  <rect x="412" y="530" width="182" height="48" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" rx="6"/>
  <text x="503" y="550" fill="#111827" text-anchor="middle">Linear 14 to H, ReLU</text>
  <text x="503" y="566" font-size="11.5" fill="#374151" text-anchor="middle">H = 128 (atlas) or 50 (small)</text>
  <rect x="616" y="530" width="186" height="48" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" rx="6"/>
  <text x="709" y="550" fill="#111827" text-anchor="middle">Linear H to H, ReLU</text>
  <text x="709" y="566" font-size="11.5" fill="#374151" text-anchor="middle">ReLU after the last hidden layer</text>
  <path d="M 198 554 L 218 554" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 390 554 L 410 554" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 594 554 L 614 554" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="616" y="616" width="186" height="48" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" rx="6"/>
  <text x="709" y="636" fill="#111827" text-anchor="middle">Linear H to 6 x 25</text>
  <text x="709" y="652" font-size="11.5" fill="#374151" text-anchor="middle">zero-initialised: starts as identity</text>
  <path d="M 709 578 L 709 614" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="330" y="616" width="264" height="48" fill="#fce7f3" stroke="#db2777" stroke-width="1.5" rx="6"/>
  <text x="462" y="636" fill="#111827" text-anchor="middle">spline parameters (6, 25)</text>
  <text x="462" y="652" font-size="11.5" fill="#374151" text-anchor="middle">per dim: 8 widths, 8 heights, 9 knot slopes</text>
  <path d="M 616 640 L 596 640" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="58" y="616" width="250" height="48" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" rx="6"/>
  <text x="183" y="636" fill="#111827" text-anchor="middle">RQS on [-B-1, B+1] = [-5, 5]</text>
  <text x="183" y="652" font-size="11.5" fill="#374151" text-anchor="middle">applied to the dims with m = 0</text>
  <path d="M 330 640 L 310 640" stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="58" y="690" font-size="12" fill="#374151">Dims with m = 1 pass through unchanged and condition the spline; outside [-5, 5] the spline is the identity.</text>
  <text x="58" y="708" font-size="12" fill="#374151">The Jacobian is triangular, so log|det| is the sum of the spline slopes' logs over the transformed dims.</text>
  <text x="58" y="726" font-size="12" fill="#374151">distrax MaskedCoupling + RationalQuadraticSpline; weights in float64 (default) or float32; optax Adam.</text>

  <!-- side panel: log_prob -->
  <rect x="846" y="490" width="314" height="262" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" rx="6"/>
  <text x="862" y="512" font-size="15" font-weight="bold" fill="#111827">Density with the count marginalized</text>
  <text x="862" y="540" font-size="12" fill="#374151">log P(N_res, S_gw | context) =</text>
  <text x="872" y="560" font-size="12" fill="#374151">log sum_k w_k q(y_k | c) |dy_k/dx|,</text>
  <text x="872" y="580" font-size="12" fill="#374151">y_k = y(N + u_k, S)</text>
  <text x="862" y="606" font-size="12" fill="#374151">u_k, w_k: 32 Gauss-Legendre nodes on [0, 1]</text>
  <text x="862" y="626" font-size="12" fill="#374151">q: base density times the flow's |det|</text>
  <text x="862" y="652" font-size="12" fill="#374151">Pure jax.jit functions of the arrays:</text>
  <text x="862" y="672" font-size="12" fill="#374151">differentiable in context and S_gw, and</text>
  <text x="862" y="692" font-size="12" fill="#374151">usable inside an outer jit / grad / vmap</text>
  <text x="862" y="712" font-size="12" fill="#374151">(jax_log_prob, the NUTS entry point).</text>
  <text x="862" y="738" font-size="12" fill="#374151">Params per band: 151,128 (H=128); 43,800 (H=50)</text>
</svg>
